[data]
dataset_yaml = "outputs/nestler-detection-dataset/fold-1/dataset.yaml"
dataset_summary = "artifacts/nestler-detection-dataset/summary.json"
class_name = "nestler_tracker_region"

[model]
architecture = "yolo26n.yaml"
initialization_weights = "weights/pio-yolo26n/best.pt"

[training]
epochs = 5
image_size = 480
batch_size = 4
workers = 0
patience = 5
seed = 2026
device = "auto"
max_detections = 1500
close_mosaic = 5
optimizer = "auto"
weight_decay = 0.0005

[output]
run_root = "outputs/nestler-tracker-yolo26n"
artifact_dir = "artifacts/nestler-tracker-yolo26n"
checkpoint_dir = "weights/nestler-tracker-yolo26n"
