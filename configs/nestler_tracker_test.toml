[input]
dataset_yaml = "outputs/nestler-detection-dataset/fold-1/dataset.yaml"
dataset_summary = "artifacts/nestler-detection-dataset/summary.json"
training_summary = "artifacts/nestler-tracker-yolo26n/training_summary.json"
weights = "weights/nestler-tracker-yolo26n/best.pt"

[evaluation]
image_size = 480
batch_size = 4
workers = 0
device = "auto"
confidence_threshold = 0.001
iou_threshold = 0.7
max_detections = 1500

[gate]
minimum_map50 = 0.5
minimum_recall = 0.5
domestic_validation_required = true

[output]
run_root = "outputs/nestler-tracker-yolo26n-test"
artifact_dir = "artifacts/nestler-tracker-yolo26n/test"

