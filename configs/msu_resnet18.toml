[data]
dataset_path = "extracted/msu_v2/MSU Poultry Piling Dataset/piling_dataset"
image_height = 295
image_width = 672
grayscale = true

[model]
architecture = "resnet18"
pretrained = true

[training]
seed = 2026
epochs = 10
batch_size = 16
num_workers = 4
learning_rate = 0.001
momentum = 0.9
weight_decay = 0.0001
lr_step_size = 7
lr_gamma = 0.1

[output]
checkpoint_dir = "weights/msu-resnet18"
artifact_dir = "artifacts/msu-resnet18"
